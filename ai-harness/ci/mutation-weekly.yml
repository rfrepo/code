# .github/workflows/mutation-weekly.yml — Stryker tests your tests, weekly.
# Catches tautological/numb suites TDD warns about. Too slow for hooks/PRs.
name: mutation-weekly
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx stryker run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation
