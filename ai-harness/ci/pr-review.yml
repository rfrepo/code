# .github/workflows/pr-review.yml — multi-model advisory review on PRs.
# Requires CODEX_API_KEY secret if the codex reviewer is enabled.
# Third-party reviewers (CodeRabbit/Greptile) run via their own GitHub Apps.
name: pr-review
on: [pull_request]
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Run reviewers
        env:
          OPENAI_API_KEY: ${{ secrets.CODEX_API_KEY }}
        run: bash scripts/review.sh "${{ github.event.pull_request.base.sha }}" | tee review-output.md
      - name: Comment findings
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const body = fs.readFileSync('review-output.md', 'utf8').slice(0, 65000)
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `## Harness review (advisory)\n\n${body}`,
            })
